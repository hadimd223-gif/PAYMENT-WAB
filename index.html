<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M H X - Secure Payment Gateway</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            background-color: #000000;
        }

        /* ব্যাকগ্রাউন্ড ভিডিও */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.45;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.85) 0%, rgba(15, 23, 42, 0.9) 100%);
            z-index: 2;
        }

        .card {
            position: relative;
            z-index: 3;
            background: rgba(18, 24, 36, 0.88);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 420px;
            padding: 30px 25px;
            text-align: center;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ffffff, #a855f7, #ffffff);
        }

        /* ব্ল্যাক অ্যান্ড হোয়াইট প্রিমিয়াম গোল লোগো (MHX) */
        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            background: #050505;
            border: 2.5px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
            50% { box-shadow: 0 0 30px rgba(255, 255, 255, 0.5); }
            100% { box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.4);
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 11px;
            color: #a1a1aa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 20px;
        }

        .payment-info-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .number-box {
            background: rgba(0, 0, 0, 0.9);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .number-text {
            color: #ffffff;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .instruction {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a1a1aa;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #334155;
            border-radius: 10px;
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .form-group input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #ffffff, #e2e8f0);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .footer-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 18px;
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড ভিডিও -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-numbers-31915-large.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <div class="card">
        <!-- এমএইচএক্স ব্ল্যাক অ্যান্ড হোয়াইট গোল লোগো -->
        <div class="logo-container">
            <div class="logo-text">MHX</div>
        </div>
        
        <div class="brand-logo">M H X</div>
        <div class="brand-subtitle">Secure Payment Gateway</div>

        <div class="payment-info-box">
            <div class="info-row">
                <span>মেথড:</span>
                <span style="font-weight: 700; color: #ffffff;"><i class="fa-solid fa-wallet"></i> bKash Personal</span>
            </div>
            <div class="info-row" id="amountRow" style="display:none;">
                <span>নির্বাচিত এমাউন্ট:</span>
                <span id="displayAmount" style="font-weight: 700; color: #4ade80;">0 ৳</span>
            </div>
            
            <div style="margin-top: 8px;">
                <span style="font-size: 12px; color: #94a3b8;">সেন্ড মানি নম্বর:</span>
                <div class="number-box">
                    <span class="number-text" id="num">01635068564</span>
                    <button class="copy-btn" onclick="copyNumber()"><i class="fa-regular fa-copy"></i> Copy</button>
                </div>
            </div>

            <div class="instruction">
                💡 <b>নোট:</b> সঠিক এমাউন্ট সেন্ড মানি করার পর প্রাপ্ত TrxID নিচে লিখে সাবমিট করুন।
            </div>
        </div>

        <div id="paymentForm">
            <div class="form-group">
                <label for="trxid">ট্রানজেকশন আইডি (TrxID):</label>
                <div class="input-box">
                    <i class="fa-solid fa-receipt"></i>
                    <input type="text" id="trxid" placeholder="যেমন: 9H74K3..." required autocomplete="off">
                </div>
            </div>

            <button type="button" class="submit-btn" onclick="submitTrx()"><i class="fa-solid fa-shield-check"></i> VERIFY & SUBMIT</button>
        </div>

        <div class="footer-text">
            🔒 256-Bit SSL Encrypted & Secured Connection
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const amt = urlParams.get('amount');
        if(amt) {
            document.getElementById('displayAmount').innerText = amt + " ৳";
            document.getElementById('amountRow').style.display = "flex";
        }

        function copyNumber() {
            var num = document.getElementById("num").innerText;
            navigator.clipboard.writeText(num);
            alert("নম্বর কপি করা হয়েছে: " + num);
        }

        function submitTrx() {
            var trx = document.getElementById("trxid").value.trim();
            if(trx === "") {
                alert("দয়া করে ট্রানজেকশন আইডি (TrxID) দিন!");
                return;
            }

            // টেলিগ্রাম মিনি অ্যাপের মাধ্যমে ডেটা বটে পাঠিয়ে অটোমেটিক টেলিগ্রামে ফিরিয়ে নিয়ে যাবে
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const dataToSend = JSON.stringify({ trxid: trx, amount: amt || "100" });
                tg.sendData(dataToSend);
            } else {
                alert("ট্রানজেকশন সফলভাবে জমা হয়েছে: " + trx);
                tg.close();
            }
        }
    </script>
</body>
</html>
