<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M H X - Payment Gateway</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #07090e 0%, #121824 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(18, 24, 36, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 400px;
            padding: 30px 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #e91e63, #ff4081);
        }

        /* গোল লোগো ডিজাইন */
        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            background: #000;
            border: 2.5px solid #e91e63;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.4);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .payment-info-box {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .number-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px dashed #e91e63;
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .number-text {
            color: #e91e63;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .instruction {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 8px;
            line-height: 1.4;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid #334155;
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            outline: none;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .form-group input:focus {
            border-color: #e91e63;
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.2);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #e91e63, #ff4081);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.3);
            transition: 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .footer-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- আপনার দেওয়া গোল লোগো -->
        <div class="logo-container">
            <img src="https://i.ibb.co.com/84c7Kz8/IMG-20260226-WA0005.jpg" alt="MHX Free Fire Logo">
        </div>
        
        <div class="brand-logo">M H X</div>
        <div class="brand-subtitle">Secure Payment Gateway</div>

        <div class="payment-info-box">
            <div class="info-row">
                <span>পেমেন্ট মেথড:</span>
                <span style="font-weight: 700; color: #e91e63;"><i class="fa-solid fa-wallet"></i> bKash Personal</span>
            </div>
            
            <div style="margin-top: 8px;">
                <span style="font-size: 12px; color: #94a3b8;">সেন্ড মানি নম্বর:</span>
                <div class="number-box">
                    <span class="number-text" id="num">01635068564</span>
                    <button class="copy-btn" onclick="copyNumber()"><i class="fa-regular fa-copy"></i> Copy</button>
                </div>
            </div>

            <div class="instruction">
                💡 <b>নোট:</b> ওপরের নম্বরে সেন্ড মানি করার পর প্রাপ্ত TrxID নিচে লিখে সাবমিট করুন।
            </div>
        </div>

        <div id="paymentForm">
            <div class="form-group">
                <label for="trxid">ট্রানজেকশন আইডি (TrxID):</label>
                <div class="input-box">
                    <i class="fa-solid fa-receipt"></i>
                    <input type="text" id="trxid" placeholder="যেমন: 9H74K3..." required autocomplete="off">
                </div>
            </div>

            <button type="button" class="submit-btn" onclick="submitTrx()"><i class="fa-solid fa-shield-check"></i> SUBMIT TRXID</button>
        </div>

        <div class="footer-text">
            🔒 256-Bit SSL Encrypted & Secured Connection
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function copyNumber() {
            var num = document.getElementById("num").innerText;
            navigator.clipboard.writeText(num);
            alert("নম্বর কপি করা হয়েছে: " + num);
        }

        function submitTrx() {
            var trx = document.getElementById("trxid").value.trim();
            if(trx === "") {
                alert("দয়া করে ট্রানজেকশন আইডি (TrxID) দিন!");
                return;
            }

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const dataToSend = JSON.stringify({ trxid: trx });
                tg.sendData(dataToSend);
            } else {
                alert("আপনার ট্রানজেকশন আইডি সফলভাবে জমা হয়েছে: " + trx);
                tg.close();
            }
        }
    </script>
</body>
</html>
