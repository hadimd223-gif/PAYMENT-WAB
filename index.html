<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M H X - Payment Gateway</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            padding: 30px 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #e91e63, #ff4081);
        }

        .brand-logo {
            font-size: 32px;
            font-weight: 800;
            color: #e91e63;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .payment-info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 18px;
            text-align: left;
            margin-bottom: 25px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #334155;
        }

        .number-box {
            background: #fff;
            border: 1px dashed #e91e63;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .number-text {
            color: #e91e63;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .instruction {
            font-size: 12px;
            color: #64748b;
            margin-top: 10px;
            line-height: 1.4;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            text-transform: uppercase;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #e91e63, #ff4081);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(233, 30, 99, 0.3);
        }

        .success-msg {
            display: none;
            background: #d1fae5;
            color: #065f46;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-logo">M H X</div>
        <div class="brand-subtitle">Secure Payment Gateway</div>

        <div class="payment-info-box">
            <div class="info-row">
                <span>পেমেন্ট মেথড:</span>
                <span style="font-weight: 700; color: #e91e63;"><i class="fa-solid fa-wallet"></i> bKash Personal</span>
            </div>
            
            <div style="margin-top: 10px;">
                <span style="font-size: 13px; color: #475569;">সেন্ড মানি নম্বর:</span>
                <div class="number-box">
                    <span class="number-text" id="num">01635068564</span>
                    <button class="copy-btn" onclick="copyNumber()"><i class="fa-regular fa-copy"></i> Copy</button>
                </div>
            </div>

            <div class="instruction">
                💡 <b>নোট:</b> ওপরের নম্বরে সেন্ড মানি করে TrxID নিচে লিখে সাবমিট করুন।
            </div>
        </div>

        <div id="paymentForm">
            <div class="form-group">
                <label for="trxid">ট্রানজেকশন আইডি (TrxID) দিন:</label>
                <div class="input-box">
                    <i class="fa-solid fa-receipt"></i>
                    <input type="text" id="trxid" placeholder="যেমন: BKL9X87K..." required autocomplete="off">
                </div>
            </div>

            <button type="button" class="submit-btn" onclick="submitTrx()"><i class="fa-solid fa-shield-check"></i> SUBMIT TRXID</button>
        </div>

        <div id="successBox" class="success-msg">
            <i class="fa-solid fa-circle-check" style="font-size: 20px; margin-bottom: 5px;"></i><br>
            আপনার ট্রানজেকশন আইডি সফলভাবে জমা হয়েছে! দয়া করে টেলিগ্রাম বটে ফিরে যান।
        </div>

        <div class="footer-text" style="font-size: 11px; color: #94a3b8; margin-top: 20px;">
            🔒 256-Bit SSL Secured Connection
        </div>
    </div>

    <script>
        function copyNumber() {
            var num = document.getElementById("num").innerText;
            navigator.clipboard.writeText(num);
            alert("নম্বর কপি করা হয়েছে: " + num);
        }

        function submitTrx() {
            var trx = document.getElementById("trxid").value;
            if(trx.trim() === "") {
                alert("দয়া করে ট্রানজেকশন আইডি (TrxID) লিখুন!");
                return;
            }
            document.getElementById("paymentForm").style.display = "none";
            document.getElementById("successBox").style.display = "block";
        }
    </script>
</body>
</html>
